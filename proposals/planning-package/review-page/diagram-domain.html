<script type="application/json" id="page-data">{"md": {}, "graphs": {"graph": {"schema": "typed-graph/v1", "kinds": {"request": {"label": "Request (in code)", "color": "#2f6fb5", "explain": "What an agent hands the router: the person's question and the facts about the source model."}, "contract": {"label": "Contract (in code)", "color": "#1f4e79", "explain": "A JSON Schema record the router reads, prints or hands to a product."}, "knowledge": {"label": "Reviewed knowledge (in code)", "color": "#5b7fa6", "explain": "Hand-edited catalogs and heuristics the router reads; pinned by tests."}, "step": {"label": "Router step (in code)", "color": "#6f95c2", "explain": "A step that turns a request into a recommendation or refuses one."}, "record": {"label": "Record (in code)", "color": "#3d6f9e", "explain": "What the router writes and keeps: disposition logs, observations, writing records."}, "viewer": {"label": "Shared viewer (in code)", "color": "#2a5d8f", "explain": "Rendering code other projects vendor: the graph viewer."}, "party": {"label": "Outside this repository", "color": "#7a8491", "explain": "People and systems that use the router or own the facts; not part of this codebase."}, "proposed": {"label": "Named in issues, not built", "color": "#b35c00", "explain": "Concepts open issues name that no code here implements yet.", "dashed": true}}, "nodes": [{"id": "use-case", "label": "Use case", "kind": "request", "explain": "The request: the person's question, information structure, intent, task, dynamics and the parts they asked to see. Validated against schemas/use-case.schema.json before routing."}, {"id": "semantic-availability", "label": "Semantic availability", "kind": "request", "explain": "Whether the owning model can supply the semantic view a representation needs (available, partial, unavailable). Unavailable rejects every candidate."}, {"id": "representation", "label": "Representation", "kind": "knowledge", "explain": "One way to show information (graph, matr l": "Checklist", "kind": "step", "explain": "The items a built page must answer, collected from the recommendation (and any approved reference)."}, {"id": "approved-reference", "label": "Approved reference", "kind": "request", "explain": "A mockup or sketch Brian approved, pinned by sha256; it becomes a required checklist item needing evidence."}, {"id": "disposition", "label": "Disposition", "kind": "step", "explain": "The builder's answer to every checklist item (satisfied, na, skipped or failed, with a reason); a silent gap is refused."}, {"id": "disposition-log", "label": "Disposition log", "kind": "record", "explain": "The daily file outside any repository, ~/projects/data/logs/disposition/<date>.jsonl, gaining one line per accepted disposition (DISPOSITION_LOG_DIR overrides). The default since 2026-10-23 (commit 04dadd1)."}, {"id": "committed-disposition", "label": "Committed disposition record", "kind": "record", "explain": "One JSON file written only with --out-dir DIR, for evidence committed next to the work it judges; disposition-logs/ keeps such examples."}, {"id": "observation-row", "label": "Observation row", "kind": "record", "explain": "One line per disposition run, accepted or refused, appended to one file per day outside the repository."}, {"id": "writing-record", "label": "Writing record", "kind": "record", "explain": "<draft>.writing.json: the writing route chosen and each checklist item's observation; a pass needs a verbatim quote."}, {"id": "sketch-set", "label": "Sketch set", "kind": "step", "explain": "Variants of a view drawn for Brian to pick from before building; the pick becomes an approved reference."}, {"id": "typed-graph", "label": "Typed graph", "kind": "contract", "explain": "typed-graph/v1: kinds, nodes, edges and hyperedges; the graph viewer's published input."}, {"id": "relation-hub", "label": "Relation hub (hyperedge)", "kind": "contract", "explain": "A fact joining several things in named roles, drawn as one hub with role-labelled spokes."}, {"id": "graph-viewer", "label": "Graph viewer", "kind": "viewer", "explain": "The shared React Flow + ELK/force viewer projects vendor as dist/graph-viewer.js."}, {"id": "large-graph-layout", "label": "Large-graph layout", "kind": "viewer", "explain": "Over 60 nodes or 120 edges the viewer uses fast ELK settings and falls back to force when a layout throws."}, {"id": "coding-agent", "label": "Coding agent", "kind": "party", "explain": "Claude Code or Codex loading SKILL.md and running recommend and disposition while building a page."}, {"id": "source-model", "label": "Owning source model", "kind": "party", "explain": "The project that owns the facts (Company Planning, weekly plans, DoDAF data); the router never writes to it; a SurfaceSpec binds each source by id, owner and revision."}, {"id": "consuming-product", "label": "Consuming product", "kind": "party", "explain": "The page or app that renders the recommended views and performs any authoritative write (review pages, workbenches, demos); the Company Planning review is the one built here."}, {"id": "force-by-size", "label": "Force layout by size", "kind": "proposed", "explain": "When the caller gives no layout, graphs above the size threshold get the force layout instead of ELK, and an unchanged update does not lay out again (the dense-layout plan; issue #169)."}, {"id": "elk-worker", "label": "Layout off the main thread", "kind": "proposed", "explain": "Run the layout in a web worker so no layout blocks the page at all; out of the dense-layout plan (issue #169)."}, {"id": "cross-document-link", "label": "Cross-document claim link", "kind": "proposed", "explain": "Links between claims in different documents (retells, agrees, conflicts) for documentsToTypedGraph (issue #167)."}, {"id": "grouped-layout", "label": "Grouped layout", "kind": "proposed", "explain": "Cluster nodes by kind for large domain maps (issue #149)."}], "edges": [{"id": "e1", "source": "use-case", "target": "semantic-availability", "label": "declares"}, {"id": "e2", "source": "use-case", "target": "route", "label": "input to"}, {"id": "e3", "source": "representation", "target": "route", "label": "candidates for"}, {"id": "e4", "source": "heuristic-weights", "target": "route", "label": "scores"}, {"id": "e5", "source": "route", "target": "view-spec", "label": "builds"}, {"id": "e6", "source": "view-spec", "target": "collection-spec", "label": "grouped into"}, {"id": "e7", "source": "view-spec", "target": "surface-spec", "label": "bound into"}, {"id": "e8", "source": "composition-heuristic", "target": "page-plan", "label": "applied by"}, {"id": "e9", "source": "route", "target": "page-plan", "label": "feeds"}, {"id": "e10", "source": "view-spec", "target": "agent-recommendation", "label": "part of"}, {"id": "e11", "source": "page-plan", "target": "agent-recommendation", "label": "part of"}, {"id": "e12", "source": "implementation", "target": "agent-recommendation", "label": "hinted in"}, {"id": "e13", "source": "agent-recommendation", "target": "checklist", "label": "yields"}, {"id": "e14", "source": "approved-reference", "target": "checklist", "label": "adds item"}, {"id": "e15", "source": "sketch-set", "target": "approved-reference", "label": "picked into"}, {"id": "e16", "source": "checklist", "target": "disposition", "label": "answered by"}, {"id": "e17", "source": "disposition", "target": "disposition-log", "label": "accepted appends"}, {"id": "e18", "source": "disposition", "target": "committed-disposition", "label": "with --out-dir writes"}, {"id": "e19", "source": "disposition", "target": "observation-row", "label": "every run appends"}, {"id": "e20", "source": "writing-form", "target": "writing-record", "label": "routes"}, {"id": "e21", "source": "typed-graph", "target": "graph-viewer", "label": "drawn by"}, {"id": "e22", "source": "relation-hub", "target": "typed-graph", "label": "part of"}, {"id": "e23", "source": "large-graph-layout", "target": "graph-viewer", "label": "layout of"}, <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('page-data').textContent);
function renderMd(id, item) {
  const host = document.getElementById(id); if (!host || !window.marked) return;
  host.innerHTML = marked.parse(item.text);
  if (item.base) host.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (!/^([a-z]+:|#|\/)/i.test(h)) a.href = new URL(h, item.base).href;
  });
  host.querySelectorAll('code.language-mermaid').forEach(c => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
}
// Size a frame from its drawing so its words read at their real size when the width allows; when even
// that leaves them small, say so under the drawing and point at its full page.
function sized(el) {
  return ({width, height}) => {
    if (!width || !height) return;
    const wz = Math.min(1, (el.clientWidth * 0.84) / width);
    el.style.height = Math.round(Math.max(320, Math.min(window.innerHeight * 0.88, height * wz / 0.84))) + 'px';
    const zoom = Math.min(1, (el.clientWidth * 0.84) / width, (el.clientHeight * 0.84) / height);
    if (zoom < 0.7 && !el.nextElementSibling?.classList.contains('smallnote')) {
      const note = document.createElement('p'); note.className = 'note smallnote';
      const own = el.dataset.page ? ` or <a href="${el.dataset.page}">open it on its own page</a>` : '';
      note.innerHTML = `Shown whole at ${Math.round(zoom * 100)}% of full size, so the words are small here. Press <b>Full page</b> (top-left of the drawing)${own} to read it.`;
      el.after(note);
    }
  };
}
for (const [id, item] of Object.entries(D.md || {})) renderMd(id, item);
for (const [id, g] of Object.entries(D.graphs || {})) {
  const el = document.getElementById(id); if (!el || !window.GraphViewer) continue;
  const v = GraphViewer.mount(el, {graph: g, onLayout: D.full ? undefined : sized(el)});
  if (D.full && v && v.fullPage) setTimeout(() => v.fullPage(true), 300);
}
if (window.mermaid) {
  mermaid.initialize({startOnLoad: false, theme: 'neutral', securityLevel: 'strict'});
  const run = () => mermaid.run({querySelector: '.mermaid:not([data-processed])'});
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (d.open) run(); }));
  run();
} else {
  document.querySelectorAll('.mermaid').forEach(el => { el.style.whiteSpace = 'pre'; el.style.fontFamily = 'monospace'; });
}
</script></body></html>
