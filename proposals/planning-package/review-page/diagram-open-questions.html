nds direction"}, {"id": "Q3", "label": "Q3 Not in the code2 format", "kind": "AgentQ", "explain": "repo_format.py finds the repository outside the code2 format (no AGENTS.md, docs/index.md, arc42.md, LikeC4 diagram, OpenSpec specs, lefthook.yml or Makefile); with no Makefile, ship's default make check fails and every merge must pass --check 'npm test'. When does each missing item land? Blocks: whether ship runs this repository's check without a flag; the repository-format check stays failing (exit 1, 7 items) until the last item lands, which is why this question stays open"}, {"id": "coding-agent", "label": "Coding agent", "kind": "Concept", "explain": "Claude Code or Codex loading SKILL.md and running recommend and disposition while building a page."}, {"id": "Q4", "label": "Q4 Where the stray logs came from", "kind": "Resolved", "explain": "Eleven disposition records sat untracked in the primary checkout's disposition-logs/ and became pull request #179. Does the disposition gate still write stray files into checkouts? Blocks: whether the disposition gate needs another change, or #179 is a one-time cleanup"}, {"id": "disposition-log", "label": "Disposition log", "kind": "Concept", "explain": "The daily file outside any repository, ~/projects/data/logs/disposition/<date>.jsonl, gaining one line per accepted disposition (DISPOSITION_LOG_DIR overrides). The default since 2026-10-23 (commit 04dadd1)."}, {"id": "committed-disposition", "label": "Committed disposition record", "kind": "Concept", "explain": "One JSON file written only with --out-dir DIR, for evidence committed next to the work it judges; disposition-logs/ keeps such examples."}, {"id": "disposition", "label": "Disposition", "kind": "Concept", "explain": "The builder's answer to every checklist item (satisfied, na, skipped or failed, with a reason); a silent gap is refused."}, {"id": "Q5", "label": "Q5 Nine plans await acceptance", "kind": "Resolved", "explain": "Nine tranche plans in docs/plans/ say 'awaiting human review' or 'human acceptance pending' for proving applications. Are they history or still waiting on someone? Blocks: whether the review page lists them as open human checkpoints"}, {"id": "consuming-product", "label": "Consuming product", "kind": "Concept", "explain": "The page or app that renders the recommended views and performs any authoritative write (review pages, workbenches, demos); the Company Planning review is the one built here."}, {"id": "Q9", "label": "Q9 What delay is a freeze?", "kind": "Resolved", "explain": "The plan promises a dense graph never freezes the page, but its first stop condition was an unsourced 2 seconds, and the viewer's own comment says a 127-box, 246-link graph already takes about 2 s with the fast settings (graph-viewer/src/model.mjs:105). What layout time counts as no freeze? Blocks: whether the plan stops after measuring or builds force-by-size"}, {"id": "elk-worker", "label": "Layout off the main thread", "kind": "Concept", "explain": "Run the layout in a web worker so no layout blocks the page at all; out of the dense-layout plan (issue #169)."}, {"id": "Q10", "label": "Q10 Old plan goals name no source", "kind": "AgentQ", "explain": "The goal-provenance check flags docs/plans/architecture-provider-boundary-t3b.md (its Goal names no source and has no actor/job form); it refuses every merge here from 2026-11-13. How should a finished plan's goal be marked? Blocks: every merge in this repository from 2026-11-13"}, {"id": "Q6", "label": "Q6 System model rules were stale", "kind": "Resolved", "explain": "durable_docs_check.py reported 7 STALE system-model rules: their owner files changed after the rules were last reviewed. Do the rules and the line references still hold? Blocks: the durable-documents check and whether the system model can be trusted"}, {"id": "route", "label": "Route (score and rank)", "kind": "Concept", "explain": "Scores every representation against the use case and ranks them; rejects all when seman <script>
const D = JSON.parse(document.getElementById('page-data').textContent);
function renderMd(id, item) {
  const host = document.getElementById(id); if (!host || !window.marked) return;
  host.innerHTML = marked.parse(item.text);
  if (item.base) host.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (!/^([a-z]+:|#|\/)/i.test(h)) a.href = new URL(h, item.base).href;
  });
  host.querySelectorAll('code.language-mermaid').forEach(c => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
}
// Size a frame from its drawing so its words read at their real size when the width allows; when even
// that leaves them small, say so under the drawing and point at its full page.
function sized(el) {
  return ({width, height}) => {
    if (!width || !height) return;
    const wz = Math.min(1, (el.clientWidth * 0.84) / width);
    el.style.height = Math.round(Math.max(320, Math.min(window.innerHeight * 0.88, height * wz / 0.84))) + 'px';
    const zoom = Math.min(1, (el.clientWidth * 0.84) / width, (el.clientHeight * 0.84) / height);
    if (zoom < 0.7 && !el.nextElementSibling?.classList.contains('smallnote')) {
      const note = document.createElement('p'); note.className = 'note smallnote';
      const own = el.dataset.page ? ` or <a href="${el.dataset.page}">open it on its own page</a>` : '';
      note.innerHTML = `Shown whole at ${Math.round(zoom * 100)}% of full size, so the words are small here. Press <b>Full page</b> (top-left of the drawing)${own} to read it.`;
      el.after(note);
    }
  };
}
for (const [id, item] of Object.entries(D.md || {})) renderMd(id, item);
for (const [id, g] of Object.entries(D.graphs || {})) {
  const el = document.getElementById(id); if (!el || !window.GraphViewer) continue;
  const v = GraphViewer.mount(el, {graph: g, onLayout: D.full ? undefined : sized(el)});
  if (D.full && v && v.fullPage) setTimeout(() => v.fullPage(true), 300);
}
if (window.mermaid) {
  mermaid.initialize({startOnLoad: false, theme: 'neutral', securityLevel: 'strict'});
  const run = () => mermaid.run({querySelector: '.mermaid:not([data-processed])'});
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (d.open) run(); }));
  run();
} else {
  document.querySelectorAll('.mermaid').forEach(el => { el.style.whiteSpace = 'pre'; el.style.fontFamily = 'monospace'; });
}
</script></body></html>
